<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Panel{% endblock %} · {{ brand }} WebPanel</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/ircpanel.css">
</head>
<body class="ircp" data-panel-theme="inspircd">
<header class="up-topbar">
  <a class="up-brand" href="/"><span class="up-brand-txt">{{ brand }} <small>WEBPANEL</small></span></a>
  <span class="up-server" id="upHealth" data-health="/health" title="État du serveur IRC">
    <span class="up-dot" id="upHealthDot"></span><span id="upHealthTxt">IRC</span>
  </span>
  <div class="up-topbar-right">
    <span class="who">{{ username }}{% if is_root %} <span class="tier">root</span>{% endif %}</span>
    <form method="post" action="/logout"><button class="logout up-iconbtn">Déconnexion</button></form>
  </div>
</header>

<nav class="up-nav" id="upNav">
  <a href="/" class="up-nav-item {% if active == "dashboard" %}is-active{% endif %}">Aperçu</a>
  <a href="/users" class="up-nav-item {% if active == "users" %}is-active{% endif %}">Utilisateurs</a>
  <a href="/channels" class="up-nav-item {% if active == "channels" %}is-active{% endif %}">Salons</a>
  <a href="/servers" class="up-nav-item {% if active == "servers" %}is-active{% endif %}">Serveurs</a>
  <a href="/bans" class="up-nav-item {% if active == "bans" %}is-active{% endif %}">Bans</a>
  <a href="/opers" class="up-nav-item {% if active == "opers" %}is-active{% endif %}">Opérateurs</a>
  <a href="/registrations" class="up-nav-item {% if active == "registrations" %}is-active{% endif %}">Inscriptions</a>
  <a href="/modules" class="up-nav-item {% if active == "modules" %}is-active{% endif %}">Modules</a>
  {% if show_audit %}<a href="/audit" class="up-nav-item {% if active == "audit" %}is-active{% endif %}">Audit</a>{% endif %}
</nav>

<main class="up-main">
  <div class="up-content">{% block content %}{% endblock %}</div>
</main>

<script>
// Health dot: green when the ircd link is up, grey otherwise.
(function(){
  var el=document.getElementById('upHealth'),dot=document.getElementById('upHealthDot'),txt=document.getElementById('upHealthTxt');
  if(!el)return;
  function ping(){fetch(el.dataset.health).then(r=>r.json()).then(j=>{
    if(dot)dot.style.background=j.ok?'#3fb950':'#f85149';
    if(txt)txt.textContent=j.ok?(j.name||'IRC'):'hors-ligne';
  }).catch(function(){if(dot)dot.style.background='#f85149';if(txt)txt.textContent='hors-ligne';});}
  ping();setInterval(ping,5000);
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
